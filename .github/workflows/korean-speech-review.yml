name: Korean dialogue register audit (all RPU files)

on:
  workflow_dispatch:
    inputs:
      script_limit:
        description: 'Maximum matched NPC scripts to inspect (0 = all; large runs may take longer)'
        type: choice
        required: true
        default: '0'
        options:
          - '75'
          - '150'
          - '0'
  push:
    branches:
      - 'review/rpu-v2.4.34-dialogue-20261017'
    paths:
      - 'data/text/korean/dialog/**'
      - 'korean/**'
      - '.github/workflows/korean-speech-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run auditor tests
        run: python -m unittest discover -s korean/tests -v
      - name: Identify candidate NPC speech register inconsistencies
        env:
          SCRIPT_LIMIT: ${{ inputs.script_limit || '0' }}
        run: python korean/audit_dialogue_register.py --script-limit "$SCRIPT_LIMIT" --out korean-speech-report
      - name: Upload review leads for manual verification
        uses: actions/upload-artifact@v4
        with:
          name: korean-npc-dialogue-register-review
          path: korean-speech-report/
          if-no-files-found: error
